# Task 6.6 (apply) - lint, test and build the VisionGuard web image on every push / PR.
# No secrets are needed here. If a later step needs one (e.g. pushing an image), store it under
# Settings -> Secrets and variables -> Actions and read it as ${{ secrets.NAME }}; never write it
# in this file, which is public and kept forever in git history.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: visionguard-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
